<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>艺术家个人主页</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }

        #editor-toolbar {
            display: none;
            padding: 16px;
            margin: 20px 0;
            background: #eeeeee;
        }

        .work {
            padding: 30px;
            margin-top: 20px;
            background: #dddddd;
        }

        #editor-toolbar button {
            margin: 8px 8px 8px 0;
        }

        #portfolio-canvas {
            position: relative;
            box-sizing: border-box;
            width: 100%;
            min-height: 480px;
            height: 480px;
            overflow: hidden;
            border: 1px solid #94a3b8;
            background: #f8fafc;
        }

        #editor-status {
            min-height: 1.5em;
        }

        body.editing .work {
            outline: 2px dashed #555555;
        }
    </style>
    <script type="module" src="js/portfolio.js"></script>
</head>

<body>
    <header>
        <h1>艺术家个人主页</h1>
        <p>这里展示个人介绍与作品。</p>
    </header>

    <button id="enter-edit">进入编辑模式</button>
    <button id="exit-edit" hidden>退出编辑模式</button>

    <section id="editor-toolbar" aria-label="编辑工具栏">
        <strong>编辑工具栏</strong>
        <div>
            <button id="add-rect" type="button">添加矩形</button>
            <button id="add-ellipse" type="button">添加椭圆</button>
            <button id="move-backward" type="button" disabled>下移一层</button>
            <button id="move-forward" type="button" disabled>上移一层</button>
            <button id="delete-selected" type="button" disabled>删除选中对象</button>
        </div>
        <p>点击画布中的图形可选中；选中后可使用 Delete 或 Backspace 删除。</p>
        <p id="editor-status" role="status" aria-live="polite"></p>
    </section>

    <main id="portfolio">
        <h2>我的作品</h2>

        <div class="work">
            <div id="portfolio-canvas" aria-label="作品编辑画布"></div>
        </div>
    </main>

</body>
</html>
